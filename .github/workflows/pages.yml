# Builds the shared Feather source (source.json + landing page) from every app in apps.json and deploys it to
# https://<owner>.github.io/. Runs on push, every 30 minutes, on demand, and when an app's CI pings it.
name: Feather source

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-updated]

permissions:
  contents: write  # mirror IPAs into this repo's releases (permanent download URLs)
  pages: write
  id-token: write
  actions: write   # keepalive: re-enable this workflow so the schedule never lapses after 60 quiet days

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build source (mirrors IPAs into releases)
        env:
          MIRROR: "1"
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_source.py "$GITHUB_REPOSITORY_OWNER" site

      - name: Validate
        run: |
          python3 -c "import json; s=json.load(open('site/source.json')); assert s['apps'], 'no apps'; print([a['name']+' '+a['version'] for a in s['apps']])"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages sometimes can't see the artifact uploaded a moment earlier ("No artifacts named github-pages
      # were found"); a second try after a pause works. Try up to three times, then fail the job so it shows.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the last deploy try
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy (last try)
        id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/enable" >/dev/null && echo "schedule kept alive"
